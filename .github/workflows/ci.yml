name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 三平台跑同一套测试：Windows 上 cmd.cwd 是反斜杠路径、os.homedir() 读 USERPROFILE，
    # 只在 Linux 跑会漏掉这类回归。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test — imports index.ts directly (native type stripping, no build)
        run: node test/statusline.test.mjs

  test-floor:
    # engines 写的是 >=22.18，而测试直接 import index.ts —— 吃的是 Node 的原生类型擦除，
    # 22.18 恰好是这条能力刚放开的那一版。只在 24 上跑绿，证明不了最低支持线是绿的。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Test on the declared minimum Node
        run: node test/statusline.test.mjs

  typecheck:
    # 测试只验证运行时行为，类型错了不会发现；import type 指向本地 mod-api.d.ts
    # （ModApi 不在任何已发布包里，声明按 mod-builder 文档手写），这里逼它持续为真。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck

  catalogue:
    # 建议性检查：把内置表与最新 CLI 的模型清单比对。上游改价/改窗口会让这一步失败，
    # 提示维护者重跑 scripts/gen-model-tables.py —— 因此不阻塞 PR。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm i -g command-code
      - name: Generated tables match the installed catalogue
        run: python3 scripts/gen-model-tables.py --check
